[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "piper-runtime"
version = "0.5.0"
description = "Shared Piper observation contracts, NumPy inference and CPU/JAX control kernels"
requires-python = ">=3.11,<3.13"
license-files = ["THIRD_PARTY.md", "third-party-notices/*"]
dependencies = ["numpy>=1.26,<3"]
[project.optional-dependencies]
training = ["jax==0.10.2", "scipy>=1.13", "osqp==1.1.3", "ruckig==0.19.4"]
robot = ["pyAgxArm @ git+https://github.com/agilexrobotics/pyAgxArm.git@841a625f5f4920e776f20b934eb13048b747e6d0", "python-can==4.6.1"]
test = ["pytest>=8"]
[project.scripts]
piper-policy-check = "piper_policy_runtime.check:main"
piper-policy-shadow = "piper_policy_runtime.shadow:main"
piper-runtime-info = "piper_runtime.identity:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
piper_policy_runtime = ["*.cpp"]
piper_runtime = ["data/*", "data/notices/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
